      <a class="scroll-cue" href="#content" aria-label="Scroll to the content"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></a>

    <div class="content-wrap" id="content">
      <h2 class="section-label reveal">The formal definition</h2>

      <figure class="card evidence def reveal">
        <div class="def-head">
          <span class="tag tag-fact">Technical</span>
          <span class="level" role="img" aria-label="Difficulty: hard"><i class="on"></i><i class="on"></i><i class="on"></i></span>
          <span class="def-words">51 words</span>
        </div>
        <blockquote>
          <p>An AI system is a <mark class="key" data-plain="run by computers">machine-based</mark> system that, for explicit or implicit objectives, <mark class="key" data-plain="works out an answer from what it is given">infers</mark>, from the input it receives, how to generate <mark class="key" data-plain="what it produces: answers, text, picks">outputs</mark> such as predictions, content, recommendations, or decisions, that can influence physical or virtual environments. Different AI systems vary in their levels of <mark class="key" data-plain="how much it acts without a human">autonomy</mark> and adaptiveness after deployment.</p>
        </blockquote>
        <p class="decode-out" id="decode-out" aria-live="polite">Tap a highlighted word.</p>
      </figure>

      <h2 class="section-label reveal">What it does</h2>

      <figure class="flow reveal" aria-label="Diagram: an input goes into an AI system, which produces a prediction, content, a recommendation or a decision">
        <div class="flow-row">
          <div class="flow-in">Input</div>
          <div class="flow-arrow" aria-hidden="true"></div>
          <div class="flow-ai">AI</div>
          <div class="flow-arrow" aria-hidden="true"></div>
          <ul class="flow-out">
            <li style="--k:0">Prediction</li>
            <li style="--k:1">Content</li>
            <li style="--k:2">Recommendation</li>
            <li style="--k:3">Decision</li>
          </ul>
        </div>
      </figure>

      <h2 class="section-label reveal">The simple version</h2>

      <figure class="card evidence def reveal">
        <div class="def-head">
          <span class="tag tag-opinion">Plain English</span>
          <span class="level" role="img" aria-label="Difficulty: easy"><i class="on"></i><i></i><i></i></span>
          <span class="def-words">19 words</span>
        </div>
        <blockquote>
          <p>Artificial intelligence is a system that combines mathematics, computer science, and cognitive science to mimic aspects of human behavior.</p>
        </blockquote>
        <div class="merge" aria-hidden="true">
          <span style="--k:0">Maths</span><b>+</b><span style="--k:1">Computer science</span><b>+</b><span style="--k:2">Cognitive science</span><b>=</b><em>AI</em>
